name: Update LinkedIn RSS Feed

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed so the push step doesn't fail on diverged branches
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Restore LinkedIn session cache
        uses: actions/cache@v4
        with:
          path: session.json
          key: linkedin-session-${{ github.run_id }}
          restore-keys: |
            linkedin-session-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: python scraper.py

      - name: Save LinkedIn session to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: session.json
          key: linkedin-session-${{ github.run_id }}

      - name: Commit and push feed.xml
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add feed.xml
          # Skip commit if feed.xml has not changed
          git diff --staged --quiet && echo "feed.xml unchanged, skipping commit" && exit 0
          git commit -m "chore: update RSS feed [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          # Pull with rebase to avoid conflicts if another run pushed first
          git pull --rebase origin main
          git push origin main
